[workspace]
members = [
    ".",
    "crates/core-model",
    "crates/core-vault",
    "crates/core-terminal",
    "crates/core-import",
    "crates/core-transport",
]
resolver = "2"
exclude = ["vendor/sspi", "vendor/picky", "vendor/ironrdp-connector", "vendor/ironrdp-acceptor", "vendor/vnc-rs"]

[patch.crates-io]
sspi = { path = "vendor/sspi" }
picky = { path = "vendor/picky" }
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-acceptor = { path = "vendor/ironrdp-acceptor" }
vnc-rs = { path = "vendor/vnc-rs" }

[package]
name = "rust_lib_termpulse"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
core-import = { path = "crates/core-import" }
core-model = { path = "crates/core-model" }
core-terminal = { path = "crates/core-terminal" }
core-transport = { path = "crates/core-transport" }
core-vault = { path = "crates/core-vault" }
flutter_rust_bridge = "=2.13.0"
log = "0.4"
once_cell = "1.20"
russh-sftp = "4.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
uuid = { version = "1.11", features = ["v4"] }
ironrdp = { version = "0.17", features = ["connector", "session", "graphics", "input"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest-rustls-ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
x509-cert = "0.2"
sha2 = "0.10"
vnc-rs = "0.6.1"

[dev-dependencies]
ironrdp-server = { version = "0.13", default-features = false }
rcgen = { version = "0.14", features = ["ring"] }
async-trait = "0.1"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.41", features = ["test-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3
