[package]
name = "core-vault"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
core-model = { path = "../core-model" }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.14"

