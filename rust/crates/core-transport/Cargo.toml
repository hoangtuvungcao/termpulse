[package]
name = "core-transport"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
core-model = { path = "../core-model" }
core-terminal = { path = "../core-terminal" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = { version = "0.65.4", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "4.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
tokio-socks = "0.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "1"
sspi = { version = "0.23.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
portable-pty = "0.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serialport = { version = "4.6", default-features = false }

[dev-dependencies]
rand = "0.10"
tempfile = "3.14"
rcgen = { version = "0.14", features = ["ring"] }
