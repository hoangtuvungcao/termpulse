name: Tagged native release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require a tag matching the application version
        run: python3 scripts/release.py validate-tag

  native:
    needs: validate-tag
    uses: ./.github/workflows/platform-checks.yml

  android-signed:
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRIVACY_PUBLISHER_NAME: ${{ vars.PRIVACY_PUBLISHER_NAME }}
      PRIVACY_CONTACT_EMAIL: ${{ vars.PRIVACY_CONTACT_EMAIL }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require published privacy details and upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/release.py prepare-android-signing
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.9
          cache: true
      - name: Install Android SDK and Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add --toolchain stable aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
          rustup run stable rustc --version
          flutter --version
      - run: flutter pub get
      - name: Build signed split APKs and Play upload bundle
        run: python3 scripts/release.py build-android-release
      - name: Verify signatures, ABIs, alignment and bundled native libraries
        run: python3 scripts/release.py package android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-android
          path: |
            dist/termpulse-android-*.apk
            dist/termpulse-android-play-upload.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove temporary signing material
        if: always()
        run: python3 scripts/release.py clean-android-signing

  publish:
    name: Publish only the complete, tested release
    needs: [validate-tag, native, android-signed]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-android
          path: dist
      - name: Verify the complete asset set and generate SHA256SUMS
        run: python3 scripts/release.py checksums
      - name: Create the GitHub release from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py publish
