name: Website
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and test public website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test website
        run: node --test
      - name: Build static website
        run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: termpulse-website
          path: website/dist/
          if-no-files-found: error
          retention-days: 14
